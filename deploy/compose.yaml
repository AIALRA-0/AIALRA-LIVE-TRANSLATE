name: aialra-live-translate

services:
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
      args:
        AIALRA_BUILD_ID: ${AIALRA_BUILD_ID:?full main SHA is required}
    restart: unless-stopped
    environment:
      AIALRA_BIND: 0.0.0.0:8787
      AIALRA_DATA_DIR: /data
      AIALRA_DEPLOYMENT_MODE: server
      AIALRA_BUILD_ID: ${AIALRA_BUILD_ID:?full main SHA is required}
      AIALRA_REQUIRE_AUTH_PROXY_MARKER: "true"
      AIALRA_ALLOWED_ORIGINS: ${AIALRA_ALLOWED_ORIGINS:-https://live.aialra.online}
      AIALRA_PROCESSING_LOCATION: 本机 RTX 4080 经私有通道处理
      AIALRA_WORKER_TOKEN_SHA256: ${AIALRA_WORKER_TOKEN_SHA256:?worker token hash is required}
      AIALRA_LEGACY_OWNER_SUBJECT: ${AIALRA_LEGACY_OWNER_SUBJECT:-}
      AIALRA_READWEAVE_BASE_URL: ${AIALRA_READWEAVE_BASE_URL:-}
      AIALRA_READWEAVE_ETAPI_TOKEN: ${AIALRA_READWEAVE_ETAPI_TOKEN:-}
      AIALRA_READWEAVE_ROOT_NOTE_ID: ${AIALRA_READWEAVE_ROOT_NOTE_ID:-root}
      AIALRA_READWEAVE_PUBLIC_URL: ${AIALRA_READWEAVE_PUBLIC_URL:-}
      # Bound glibc arena retention while long ReadWeave projections repeatedly build growing documents.
      MALLOC_ARENA_MAX: "1"
      # Browser PCM frames are roughly 32 KiB. Mapping allocations above 16 KiB keeps repeated
      # WebSocket frame buffers out of the long-lived general heap and returns them on release.
      MALLOC_MMAP_THRESHOLD_: "16384"
      MALLOC_TRIM_THRESHOLD_: "16384"
      LOCAL_ONLY: "true"
      CLOUD_TEXT_ALLOWED: "false"
      CLOUD_MULTIMODAL_ALLOWED: "false"
      DINGTALK_ACCESS_TOKEN: ${DINGTALK_ACCESS_TOKEN:-}
      DINGTALK_API_BASE: ${DINGTALK_API_BASE:-https://api.dingtalk.com}
      DINGTALK_TEAM_CODE: ${DINGTALK_TEAM_CODE:-}
      DINGTALK_USER_ID: ${DINGTALK_USER_ID:-}
      RUST_LOG: ${RUST_LOG:-aialra_core_server=info,tower_http=warn}
    volumes:
      - ${AIALRA_DATA_PATH:-/var/lib/aialra-live-translate}:/data
    ports:
      - 127.0.0.1:${AIALRA_PORT:-13150}:8787
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "-H", "X-aialra-auth-proxy: 1", "-H", "X-authentik-uid: deployment-health", "http://127.0.0.1:8787/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
