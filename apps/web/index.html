<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- The local desktop shell and browser preview share one accessible document root. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <!-- An inline favicon avoids an unnecessary localhost request and keeps offline logs clean. -->
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AIALRA 课堂理解台</title>
  </head>
  <body>
    <!-- React owns the application surface while the Rust service owns durable state. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
